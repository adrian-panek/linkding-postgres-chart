name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

env:
  HELM_VERSION: "3.14.0"

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-docs
        run: |
          curl -LO https://github.com/norwoodj/helm-docs/releases/download/v1.11.0/helm-docs_1.11.0_Linux_x86_64.tar.gz
          tar -xzf helm-docs_1.11.0_Linux_x86_64.tar.gz
          sudo mv helm-docs /usr/local/bin

      - name: Run helm-docs
        run: helm-docs

      - name: Check for changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Documentation needs to be regenerated. Please run 'helm-docs' locally and commit the changes."
            exit 1
          fi

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting chart: $chart"
              helm lint "$chart"
            fi
          done

      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

      - name: Validate rendered templates
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Validating templates for chart: $chart"
              helm template "$chart" | kubeval
            fi
          done

  package:
    name: Package Helm Charts
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package charts
        run: |
          mkdir -p packages
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Packaging chart: $chart"
              helm package "$chart" --destination packages
            fi
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: helm-packages
          path: packages/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint, package]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@v3
        with:
          name: helm-packages
          path: packages/

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Generate index.yaml
        run: |
          mkdir -p pages
          if [ -f "index.yaml" ]; then
            cp index.yaml pages/
          fi
          helm repo index --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} --merge pages/index.yaml packages/
          cp packages/*.tgz pages/
          cp packages/index.yaml pages/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2