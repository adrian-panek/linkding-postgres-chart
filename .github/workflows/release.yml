name: Chart Release

on:
  push:
    tags:
      - 'linkding-*'
      - 'postgres-*'
      - 'v*'

jobs:
  test:
    name: Test Charts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes-version: ['1.25.0', '1.26.0', '1.27.0', '1.28.0']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin

      - name: Test charts against multiple K8s versions
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              echo "Testing chart: $chart_name against K8s ${{ matrix.kubernetes-version }}"
              
              # Test with different values combinations
              helm template "$chart_name" "./charts/$chart_name" --validate --kube-version ${{ matrix.kubernetes-version }}
              
              # Test with minimal values
              helm template "$chart_name" "./charts/$chart_name" \
                --set "replicaCount=1" \
                --set "resources.requests.cpu=10m" \
                --set "resources.requests.memory=10Mi" \
                --validate --kube-version ${{ matrix.kubernetes-version }}
              
              # Validate manifests
              helm template "$chart_name" "./charts/$chart_name" | kubeconform -kubernetes-version ${{ matrix.kubernetes-version }} -strict
            fi
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

      - name: Scan images for vulnerabilities
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              echo "Scanning images in chart: $chart_name"
              
              # Extract image references from values.yaml
              images=$(grep -E "^\s*repository:|^\s*image:" "$chart/values.yaml" | awk '{print $2}' | sed 's/"//g')
              
              for image in $images; do
                if [[ ! "$image" =~ ^local/|^ ghcr\.io/.*localhost ]]; then
                  echo "Scanning image: $image"
                  trivy image --severity HIGH,CRITICAL "$image" || true
                fi
              done
            fi
          done

  release:
    name: Release Charts
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm Chart Releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          install_dir: .
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"