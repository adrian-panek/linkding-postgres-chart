name: CI/CD Pipeline

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  release:
    types: [ published ]

env:
  HELM_VERSION: "3.14.0"

jobs:
  package:
    name: Package Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package charts
        run: |
          mkdir -p packages
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Packaging chart: $chart"
              helm package "$chart" --destination packages
            fi
          done
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: helm-packages
          path: packages/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@v3
        with:
          name: helm-packages
          path: packages/

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Generate index.yaml
        run: |
          mkdir -p pages
          if [ -f "index.yaml" ]; then
            cp index.yaml pages/
          fi
          helm repo index --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} --merge pages/index.yaml packages/
          cp packages/*.tgz pages/
          cp packages/index.yaml pages/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4